name: shellcheck

on:
  push:
    paths:
      - build_db_all
      - build_db_all_build_solr
      - build_solr
      - load_db_build_solr
      - local_build_db_all
      - .github/workflows/shellcheck.yml
  pull_request:
    paths:
      - build_db_all
      - build_db_all_build_solr
      - build_solr
      - load_db_build_solr
      - local_build_db_all
      - .github/workflows/shellcheck.yml

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint build/deploy scripts
        run: shellcheck build_db_all build_db_all_build_solr build_solr load_db_build_solr local_build_db_all
