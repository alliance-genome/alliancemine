#contains only classes that come from more than one source
#for each class contained every source for that class must be listed

# priority for fields declared in superclass are not overridden by different order in subclass
# e.g. identfier and organism always have priority as defined in BioEntity

# For example, to give interpro prioritiy over uniprot for the 'shortName' field of ProteinDomain:
#
# ProteinDomain.shortName = interpro, uniprot

# To give flybase priority over all other sources for Gene name:
#
# Gene.name = flybase, *

#SequenceFeature.sequenceOntologyTerm = sgd, alliance-genes, *
#SequenceFeature.length = alliance-genes, sgd, *
#SequenceFeature.featureType = alliance-genes, sgd, *
# Enrichment-merge modules (alliance-experimental-disease, alliance-transgenic-alleles,
# alliance-disease-alleles) auto-create SOTerm refs when createItem("Gene") fires.
# Need explicit ordering so they don't collide via the catch-all *.
SequenceFeature =  sgd, alliance-genes, sgd-gff, sgd-gff-utr, alliance-disease-detail, alliance-disease-alleles, alliance-experimental-disease, alliance-transgenic-alleles, alliance-alleles, alliance-orthologs, alliance-expression, alliance-variants, alliance-gene-descriptions, alliance-agms, alliance-allele-phenotypes, alliance-gene-crossrefs, *
SOTerm = sgd, alliance-genes, *

Publication.pubXrefId = sgd, go-annotation, *
Publication.title = sgd, update-publications
Publication.journal = sgd, update-publications
Publication.citation = sgd, update-publications, *
Publication.pages = sgd, update-publications
Publication.volume = sgd, update-publications
Publication.year = sgd, update-publications
Publication.issue = sgd, update-publications

Organism.shortName = sgd, * 
Organism.name = sgd, *
Organism.species= sgd, *
Organism.genus = sgd, *
Organism.taxonId = sgd, *
Organism.commonName = sgd, *

#BioEntity.organism = sgd, *

GOTerm.ontology = go-slim, go
GOTerm.description =  go-slim, go
GOTerm.name =   go-slim, go
GOTerm.obsolete = go, go-slim

# Alliance API sources name terms the ontology loads already created; the ontology wins.
InteractionTerm.name = psi-mi-ontology, *
DOTerm.name = do, *
ECOTerm.name = eco, *

# Track M — new + extended classes via AGR API
# Allele + TransgenicAllele attribute priorities omitted because Allele extends
# SequenceFeature, which already has a class-level priority above.
DiseaseModel.modelId = alliance-disease-models, alliance-disease-detail, *
DiseaseAnnotation.uniqueId = alliance-disease, alliance-disease-detail, alliance-allele-diseases, alliance-experimental-disease, *
PhenotypeAnnotation.uniqueId = alliance-phenotypes, alliance-allele-phenotypes, *

