#index.solrurl = http://intermine.alliancegenome.org:8983/solr/alliancemine-search
index.solrurl = http://localhost:8983/solr/alliancemine-search
index.batch.size = 1000

index.temp.directory = /tmp
index.references.BioEntity = synonyms organism crossReferences
index.references.OntologyTerm = synonyms
#index.references.Gene = pathways proteins.proteinDomains goAnnotation.ontologyTerm
#index.references.Protein = proteinDomains

# Author and the interaction classes stay out of keyword search. In 9.2.0 rc3 full PubMed
# records brought 2.0M Authors (491K in 9.1.0) and STRING took Interactions to 6.7M (1.8M);
# indexing them filled the 48 GB create-search-index heap and stalled it in full GC.
# Report pages and queries still show both. index.ignore takes exact class names.
index.ignore = Comment CrossReference Location OntologyAnnotation OntologyRelation Sequence Synonym \
    Author Interaction InteractionDetail InteractionExperiment InteractionRegion \
    STRINGInteraction AlleleInteraction

index.facet.single.Category = Category
index.facet.single.Organism = organism.shortName
#index.facet.multi.Pathway = pathways.name

index.boost.Gene = 1.5
index.boost.Protein = 1.2

search.debug = false

